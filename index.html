<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESWARI L R | Full Stack Software Developer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Product+Sans:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#202124;--frame:#1f1f1f;--toolbar:#35363a;--omni:#202124;--page:#202124;--card:#292a2d;--card2:#303134;--line:#3c4043;--text:#e8eaed;--muted:#9aa0a6;--link:#8ab4f8;--url:#bdc1c6;--hover:#3c4043;--accent:#8ab4f8;--tabactive:#35363a;--shadow:0 4px 20px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#fff;--frame:#dee1e6;--toolbar:#fff;--omni:#f1f3f4;--page:#fff;--card:#fff;--card2:#f8f9fa;--line:#dadce0;--text:#202124;--muted:#5f6368;--link:#1a0dab;--url:#188038;--hover:#e8eaed;--accent:#1a73e8;--tabactive:#fff;--shadow:0 2px 10px rgba(60,64,67,.25)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,Roboto,Arial,sans-serif;background:var(--frame);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
#app{height:100%;display:flex;flex-direction:column}
/* tabs */
#tabstrip{display:flex;align-items:flex-end;padding:8px 8px 0;background:var(--frame);gap:2px;user-select:none}
#tabs{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;gap:2px}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;min-width:110px;max-width:210px;flex:0 0 auto;border-radius:10px 10px 0 0;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--tabactive);color:var(--text)}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab .x{border:0;background:none;width:18px;height:18px;border-radius:50%;font-size:10px;color:var(--muted)}
.tab .x:hover{background:var(--line);color:var(--text)}
.iconbtn{border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:14px;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn:disabled{opacity:.35;cursor:default}
/* toolbar */
#toolbar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--toolbar);border-bottom:1px solid var(--line)}
#omniwrap{flex:1;position:relative;min-width:0}
#omni{display:flex;align-items:center;gap:8px;background:var(--omni);border-radius:22px;padding:0 14px;height:36px;border:1px solid transparent}
#omni:focus-within{border-color:var(--accent)}
#omni input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:14px;font-family:inherit}
#omni i{color:var(--muted);font-size:13px}
#avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);margin:0 4px;cursor:pointer;flex:none}
#bookmarks{display:flex;gap:2px;padding:3px 10px;background:var(--toolbar);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;font-size:12px}
#bookmarks a,#bookmarks button{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;white-space:nowrap;background:none;border:0;color:var(--text);font-size:12px}
#bookmarks a:hover,#bookmarks button:hover{background:var(--hover)}
/* viewport */
#viewport{flex:1;overflow-y:auto;background:var(--page);scroll-behavior:smooth}
#viewport::-webkit-scrollbar{width:10px}#viewport::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.page{max-width:1080px;margin:0 auto;padding:28px 20px 60px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
/* suggestions */
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card2);border-radius:18px;box-shadow:var(--shadow);z-index:60;display:none;overflow:hidden;border:1px solid var(--line)}
.suggest.open{display:block}
.sg-list{max-height:min(55vh,420px);overflow-y:auto;padding:8px 0 10px}
.sg{display:flex;align-items:center;gap:14px;padding:8px 18px;cursor:pointer;font-size:14px}
.sg.sel,.sg:hover{background:var(--hover)}
.sg i.l{width:18px;text-align:center;color:var(--muted);font-size:14px}
.sg .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sg .t small{color:var(--muted);margin-left:8px;font-size:12px}
.sg .t b{color:var(--link);font-weight:600}
.sg .tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:10px}
.sg-head{padding:4px 18px 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* home */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:6vh 20px 50px}
.logo{font-family:'Product Sans',Roboto,Arial,sans-serif;font-weight:700;font-size:clamp(40px,9vw,84px);letter-spacing:-.01em;line-height:1.05;text-align:center}
.roles{font-family:'Product Sans',Roboto,Arial,sans-serif;font-weight:700;font-size:clamp(20px,4.5vw,42px);text-align:center;margin-top:4px;letter-spacing:.01em}
.roles .bar{margin:0 .15em}
.c0{color:#4285f4}.c1{color:#ea4335}.c2{color:#fbbc05}.c3{color:#34a853}
.homesearch{position:relative;width:100%;max-width:600px;margin:30px 0 8px}
.hs{display:flex;align-items:center;gap:12px;height:50px;padding:0 20px;background:var(--card2);border:1px solid var(--line);border-radius:26px;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.hs:hover,.hs:focus-within{box-shadow:var(--shadow)}
.hs input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit;min-width:0}
.hs i{color:var(--muted)}
.hbtns{display:flex;gap:10px;margin:14px 0 28px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--card2);border:1px solid var(--card2);padding:9px 18px;border-radius:6px;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--line);box-shadow:0 1px 1px rgba(0,0,0,.2)}
.results{width:100%;max-width:700px;display:flex;flex-direction:column;gap:14px}
.rhead{font-size:13px;color:var(--muted);margin:6px 2px 0}
.res{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;transition:.15s}
.res:hover{box-shadow:var(--shadow);border-color:var(--accent);transform:translateY(-1px)}
.res .site{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.fav{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;border:1px solid var(--line);flex:none}
.res .site .nm{color:var(--text);font-size:13px;line-height:1.2}
.res .site .u{color:var(--url);font-size:12px;line-height:1.2}
.res h3{margin:0 0 4px;font-size:20px;font-weight:400;color:var(--link);font-family:Roboto,Arial,sans-serif}
.res:hover h3{text-decoration:underline}
.res p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.res .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* generic */
.chip{display:inline-block;font-size:11px;padding:3px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text)}
.chip.b{background:rgba(66,133,244,.15);border-color:rgba(66,133,244,.4);color:var(--accent)}
h1.pt{font-size:30px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.6}
h2.st{font-size:18px;margin:34px 0 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h4{margin:0 0 6px;font-size:15px}
.card p,.card li{font-size:13px;line-height:1.6;color:var(--muted)}
.card ul{margin:8px 0 0;padding-left:18px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--link)}.crumb a:hover{text-decoration:underline}
.pbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card2)}
.pbtn.primary{background:#1a73e8;border-color:#1a73e8;color:#fff}
.pbtn:hover{filter:brightness(1.12)}
/* profile */
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,rgba(66,133,244,.16),rgba(234,67,53,.07),rgba(52,168,83,.12));border:1px solid var(--line);border-radius:22px;padding:28px}
.hero img{width:200px;height:250px;object-fit:cover;object-position:center 20%;border-radius:18px;border:3px solid var(--accent);box-shadow:var(--shadow)}
.hero .info{flex:1;min-width:260px}
.hero h1{margin:6px 0 4px;font-size:34px;font-family:'Product Sans',Roboto,sans-serif}
.fact{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:5px 0}
.fact i{width:16px;text-align:center}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:22px;display:flex;flex-direction:column;gap:16px}
.tl .card{position:relative}
.tl .card:before{content:'';position:absolute;left:-32px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--page)}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gal figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2);cursor:zoom-in;position:relative}
.gal img{width:100%;height:190px;object-fit:cover;object-position:top;display:block;transition:.3s}
.gal figure:hover img{transform:scale(1.04)}
.thumb{width:100%;height:170px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;display:block}
video{width:100%;max-width:860px;border-radius:14px;border:1px solid var(--line);background:#000}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:84vh;border-radius:8px}
#lb .cap{color:#ddd;font-size:13px;margin-top:10px}
#lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px}
#lb .cl{top:18px;right:18px}#lb .pv{left:18px;top:50%}#lb .nx{right:18px;top:50%}
/* filter */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fbtn{padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);font-size:12px}
.fbtn.on{background:#1a73e8;border-color:#1a73e8;color:#fff}
.hidden{display:none!important}
/* form */
.form label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.form input,.form textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:0}
.form input:focus,.form textarea:focus{border-color:var(--accent)}
#menu{position:absolute;right:12px;top:92px;width:250px;background:var(--card2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:80;display:none}
#menu.open{display:block}
#menu button{display:flex;width:100%;gap:12px;align-items:center;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:13px;text-align:left}
#menu button:hover{background:var(--hover)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;transition:.3s;z-index:300;opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px}
.slot{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
@media(max-width:640px){.hero img{width:140px;height:175px}.tab{min-width:90px}#bookmarks{display:none}}

/* ===== v2 ===== */
#omniwrap{z-index:70}
.homesearch{z-index:70}
#veil{position:fixed;left:0;right:0;bottom:0;top:120px;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
[data-theme=light] #veil{background:rgba(255,255,255,.72)}
#veil.on{opacity:1}
.suggest{margin-top:0;border-radius:0 0 22px 22px;border:1px solid var(--line);border-top:0;background:var(--card2);box-shadow:0 14px 30px rgba(0,0,0,.45);left:0;right:0}
.suggest:before{content:'';display:block;height:1px;background:var(--line);margin:0 18px}
#omniwrap.open #omni,.homesearch.open .hs{background:var(--card2);border-radius:22px 22px 0 0;border-color:var(--line);border-bottom-color:transparent;box-shadow:0 -2px 14px rgba(0,0,0,.25)}
.homesearch.open .hs{border-radius:26px 26px 0 0}
.homesearch .suggest{border-radius:0 0 26px 26px}
.sg-list{padding:6px 0 12px}
.sg{padding:10px 20px;font-size:15px;color:var(--text)}
.sg .t small{display:block;margin:2px 0 0;font-size:12px}
.sg-head{padding:10px 20px 4px;font-size:11px;font-weight:600}
.themebtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:18px;padding:0 12px;height:32px;font-size:12px;font-weight:500;flex:none;margin-left:4px}
.themebtn i{color:#fbbc05}[data-theme=light] .themebtn i{color:#5f6368}
.themebtn:hover{border-color:var(--accent)}
#loadbar{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,#4285f4,#ea4335,#fbbc05,#34a853);z-index:150;opacity:0;pointer-events:none}
#sprog{position:fixed;left:0;bottom:0;height:3px;width:0;background:#4285f4;z-index:150}
#totop{position:fixed;right:22px;bottom:26px;width:44px;height:44px;border-radius:50%;border:0;background:#1a73e8;color:#fff;box-shadow:var(--shadow);z-index:90;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s}
#totop.on{opacity:1;transform:none;pointer-events:auto}
/* website look */
.snav{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:10px clamp(14px,3vw,40px);background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.snav .brand,.sfoot .brand{font-family:'Product Sans',Roboto,sans-serif;font-weight:700;font-size:20px;white-space:nowrap}
.snav nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;justify-content:center}
.snav nav a{padding:7px 14px;border-radius:18px;font-size:13px;color:var(--muted);white-space:nowrap;transition:.2s;position:relative}
.snav nav a:hover{background:var(--hover);color:var(--text)}
.snav nav a.cur{color:var(--accent);background:rgba(66,133,244,.14);font-weight:600}
.sfoot{margin-top:40px;padding:26px clamp(14px,3vw,40px);border-top:1px solid var(--line);background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fl{display:flex;gap:10px}.fl a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.25s}
.fl a:hover{background:#1a73e8;color:#fff;transform:translateY(-3px)}
.pgwrap{min-height:60vh}
.pgwrap>.page{padding-bottom:20px}
.page{max-width:min(1500px,96vw);padding:clamp(18px,3vw,40px) clamp(14px,3vw,40px) 30px;animation:pgin .5s cubic-bezier(.2,.8,.2,1)}
.page .page{padding:0;animation:none;max-width:none}
@keyframes pgin{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.rv.in{opacity:1;transform:none}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.proj{cursor:pointer}
.pbtn.sm{padding:6px 12px;font-size:12px}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* home extras */
.home{position:relative;overflow:hidden}
.home>*{position:relative;z-index:1}
.home>.homesearch{z-index:70}
.orb{position:absolute!important;border-radius:50%;filter:blur(70px);opacity:.28;z-index:0!important;animation:float 14s ease-in-out infinite}
.o1{width:340px;height:340px;background:#4285f4;left:-80px;top:40px}.o2{width:300px;height:300px;background:#ea4335;right:-60px;top:200px;animation-delay:-5s}.o3{width:260px;height:260px;background:#34a853;left:35%;bottom:-100px;animation-delay:-9s}
@keyframes float{50%{transform:translate(40px,-40px) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hav{width:132px;height:132px;border-radius:50%;position:relative;display:grid;place-items:center;margin-bottom:16px;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.hav:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#4285f4,#ea4335,#fbbc05,#34a853,#4285f4);animation:spin 5s linear infinite}
.hav img{position:relative;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:50%;object-fit:cover;object-position:center 18%;border:4px solid var(--page)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.logo,.roles{animation:rise .7s .1s both}.roles{animation-delay:.25s}.homesearch{animation:rise .7s .4s both}.hbtns{animation:rise .7s .55s both}.results{animation:rise .7s .7s both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.btn.dl{background:#1a73e8;color:#fff;border-color:#1a73e8}
.res:hover{transform:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat b{font-size:30px;color:var(--accent);font-family:'Product Sans',Roboto,sans-serif}.stat small{color:var(--muted)}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
/* thumbs + carousel */
.tstack{position:relative;height:190px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--card2)}
.tstack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transform:scale(1.08);transition:opacity .9s,transform 4s}
.tstack img.on{opacity:1;transform:scale(1)}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 9px;border-radius:10px}
.pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(16px,3vw,44px);align-items:start}
.car{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0d0d0d;height:clamp(240px,46vh,560px);cursor:zoom-in}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.04);transition:opacity .8s ease,transform 1.2s ease}
.slides img.on{opacity:1;transform:none}
.cb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:.25s;z-index:3}
.car:hover .cb{opacity:1}.cb:hover{background:#1a73e8}.cb.pv{left:12px}.cb.nx{right:12px}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:7px;z-index:3}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}.dots i.on{background:#fff;width:22px;border-radius:5px}
.cprog{position:absolute;left:0;right:0;top:0;height:3px;z-index:3;background:rgba(255,255,255,.12)}
.cprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4285f4,#34a853);animation:cp 3.5s linear infinite}
.car.paused .cprog i{animation-play-state:paused}
@keyframes cp{to{width:100%}}
.zoom{position:absolute;left:10px;bottom:10px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:10px;opacity:0;transition:.25s;z-index:3}
.car:hover .zoom{opacity:1}

  input.addEventListener('click',()=>{if(!box.classList.contains('open'))render()});
  input.addEventListener('input',()=>{sel=-1;render()});

function initCarousels(){
  document.querySelectorAll('.car').forEach(c=>{
    const ms=+c.dataset.ms||3000;
    const imgs=[...c.querySelectorAll('.slides img')],dots=[...c.querySelectorAll('.dots i')],strip=[...(c.parentNode.querySelectorAll('.strip img'))],cnt=c.querySelector('.cnt'),prog=c.querySelector('.cprog i'),cap=c.querySelector('.ccap');
    if(prog)prog.style.animationDuration=ms+'ms';
    let k=0,paused=false;
    const show=n=>{k=(n+imgs.length)%imgs.length;imgs.forEach((im,j)=>im.classList.toggle('on',j===k));dots.forEach((d,j)=>d.classList.toggle('on',j===k));strip.forEach((d,j)=>d.classList.toggle('on',j===k));cnt.textContent=`${k+1} / ${imgs.length}`;if(cap)cap.textContent=imgs[k].alt;if(prog){prog.style.animation='none';void prog.offsetWidth;prog.style.animation='';prog.style.animationDuration=ms+'ms'}};
    const nx=c.querySelector('.nx'),pv=c.querySelector('.pv');
    if(nx)nx.onclick=e=>{e.stopPropagation();show(k+1)};if(pv)pv.onclick=e=>{e.stopPropagation();show(k-1)};
    dots.forEach((d,j)=>d.onclick=e=>{e.stopPropagation();show(j)});strip.forEach((d,j)=>d.onclick=()=>show(j));
    c.onmouseenter=()=>{paused=true;c.classList.add('paused')};c.onmouseleave=()=>{paused=false;c.classList.remove('paused')};
    c.addEventListener('click',e=>{if(e.target.closest('.cb,.dots'))return;openLb(imgs.map(im=>({src:im.src,cap:im.alt||c.dataset.name})),k)});
    if(imgs.length>1)TIMERS.push(setInterval(()=>{if(!paused&&!document.hidden)show(k+1)},ms));
  });
  document.querySelectorAll('.tstack').forEach((st,si)=>{
    const im=[...st.querySelectorAll('img')],ms=+st.dataset.ms||1000;
    if(st.dataset.lb)st.onclick=()=>openLb(ACH_IMAGES.map(a=>({src:a.src,cap:a.title})),0);
    if(im.length<2)return;let k=0;
    TIMERS.push(setTimeout(()=>{TIMERS.push(setInterval(()=>{if(document.hidden)return;im[k].classList.remove('on');k=(k+1)%im.length;im[k].classList.add('on')},ms))},Math.min(si,8)*120));
  });
}

   <nav class="gtabs"><a href="#/" class="${path==='/search'?'cur':''}"><i class="fa-solid fa-magnifying-glass"></i>All</a>${TABS.map(t=>`<a href="#${t[0]}" class="${act(t)?'cur':''}">${t[1]}</a>`).join('')}</nav></div>
   <div class="gbody"><div class="gleft">${inner}</div>${panel(path)}</div>${bigFoot()}`}
function afterShell(path){
  attachSuggest($('#gq'),$('#sg-g'),$('#gsw'));
  $('#gshare').onclick=()=>{const u=location.href;if(navigator.share)navigator.share({title:document.title,url:u}).catch(()=>{});else copyText(u)};
  const ap=$('#appsmenu');$('#gapps').onclick=e=>{e.stopPropagation();ap.classList.toggle('open')};
  const cl=e=>{if(!e.target.closest('#appsmenu')&&!e.target.closest('#gapps'))ap.classList.remove('open')};document.addEventListener('click',cl);CLEAN.push(()=>document.removeEventListener('click',cl));
  document.querySelectorAll('.pqb').forEach(b=>b.onclick=()=>b.parentNode.classList.toggle('open'));
  initPage($('#viewport'));
}
function loadStart(t){const cu=$('#curtain');cu.style.top=$('#viewport').getBoundingClientRect().top+'px';cu.classList.remove('go');void cu.offsetWidth;cu.classList.add('go');const b=$('#loadbar');b.style.transition='none';b.style.width='0';b.style.opacity='1';void b.offsetWidth;b.style.transition='width .45s ease';b.style.width='75%';
  t.loading=true;renderTabs();
  setTimeout(()=>{b.style.transition='width .2s ease';b.style.width='100%';setTimeout(()=>{b.style.opacity='0'},220);t.loading=false;renderTabs()},520)}
function initPage(vp){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);setTimeout(()=>e.target.style.transitionDelay='',1000)}}),{root:vp,threshold:.06});
  vp.querySelectorAll('.gr,.stat,.snip,.paa,.carwrap,.gal figure,.card,h2.st,.bigfoot .cta,.fcols>div').forEach((el,i)=>{el.classList.add('rv');el.style.transitionDelay=(i%4)*80+'ms';io.observe(el)});
}
/* ================== LIGHTBOX ================== */
let lbSet=[],lbIdx=0;
function openLb(set,i){lbSet=set;lbIdx=i;showLb();$('#lb').classList.add('open');document.body.classList.add('noscroll')}
function showLb(){const s=lbSet[lbIdx];$('#lbimg').src=s.src;$('#lbcap').textContent=`${s.cap} · ${lbIdx+1}/${lbSet.length}`}
function stepLb(d){lbIdx=(lbIdx+d+lbSet.length)%lbSet.length;showLb()}
function closeLb(){$('#lb').classList.remove('open');document.body.classList.remove('noscroll')}
function isTyping(el){if(!el)return false;const t=(el.tagName||'').toUpperCase();return t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||!!el.isContentEditable}
function focusSearch(){const el=$('#hsin')||$('#gq')||$('#addr');if(!el)return;el.focus({preventScroll:true});if(el.select)el.select();el.dispatchEvent(new Event('click'))}
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('open')){if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')stepLb(1);if(e.key==='ArrowLeft')stepLb(-1);return}
  if($('#rm').classList.contains('open'))return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&String(e.key).toLowerCase()==='k'){e.preventDefault();focusSearch();return}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!isTyping(document.activeElement)){e.preventDefault();focusSearch()}
});
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});

/* ================== BROWSER SHELL ================== */
let tabs=[{path:'/'}],active='/',bookmarks=new Set(['/profile','/projects']);
const BM=[['/profile','fa-user','#4285f4','Profile'],['/projects','fa-laptop-code','#a855f7','Projects'],['/achievements','fa-trophy','#fbbc05','Achievements'],['/contact','fa-paper-plane','#34a853','Contact']];
function parse(h){h=h.replace(/^#/,'')||'/';const [p,q]=h.split('?');return {path:p.replace(/\/$/,'')||'/',q:new URLSearchParams(q||'')}}
function pageInfo(path,q){
  if(path==='/projects'&&(q.get('q')||'').trim())return Object.assign({},PAGES['/projects'],{tab:'Projects: '+q.get('q').trim().slice(0,16)});
  if(path==='/search'){const s=q.get('q')||'';return {title:'“'+s+'” – Search',tab:'Search: '+s.slice(0,18),icon:'fa-magnifying-glass',color:'#4285f4'}}
  return PAGES[path]||{title:'Not found',tab:'Not found',icon:'fa-circle-exclamation',color:'#ea4335'}}
function go(path){if(location.hash.replace(/^#/,'')===path)render();else location.hash=path}
function render(){
  const {path,q}=parse(location.hash);const key=path==='/search'?'/search?q='+(q.get('q')||''):path;
  let t=tabs.find(x=>x.path===key);
  if(!t){
    // searching from inside a search tab replaces it; otherwise new tab
    const cur=tabs.find(x=>x.path===active);
    if(path==='/search'&&cur&&cur.path.startsWith('/search')){cur.path=key;t=cur}
    else if(cur&&cur.path==='/'&&path!=='/'&&tabs.filter(x=>x.path==='/').length&&false){}
    else{t={path:key};tabs.push(t)}
  }
  active=key;t.info=pageInfo(path,q);
  const vp=$('#viewport');let html='',after=null;
  if(path==='/'){html=pageHome();after=afterHome}
  else if(path==='/search'){html=pageSearch(q.get('q')||'')}
  else if(path==='/profile'){html=pageProfile();after=afterProfile}
  else if(path==='/skills')html=pageSkills();
  else if(path==='/experience')html=pageExperience();
  else if(path==='/education')html=pageEducation();
  else if(path==='/projects'){html=pageProjects();after=afterProjects}
  else if(path.startsWith('/projects/')){const id=path.split('/')[2];html=pageProject(id)}
  else if(path==='/achievements'){html=pageAch();after=afterAch}
  else if(path==='/contact'){html=pageContact();after=afterContact}
  else html=page404();
  clearTimers();veil(false);
  vp.innerHTML=path==='/'?html:shell(html,path);vp.scrollTop=0;after&&after();if(path!=='/')afterShell(path);initCarousels();loadStart(t);
  $('#addr').value=path==='/search'?'google-style search: '+(q.get('q')||''):HOST+(path==='/'?'':path)+((path==='/projects'&&q.get('q'))?'?q='+q.get('q'):'');
  $('#addr').blur();document.title=(t.info.title==='New Tab'?'ESWARI L R | Full Stack Software Developer':t.info.title+' | ESWARI L R');
  $('#lockic').className='fa-solid fa-lock';
  updStar();renderTabs();
}
function renderTabs(){
  const c=$('#tabs');c.innerHTML='';
  tabs.forEach(t=>{const i=t.info||pageInfo(parse(t.path).path,parse(t.path).q);const spin=t.loading;
    const d=document.createElement('div');d.className='tab'+(t.path===active?' active':'');d.title=i.title;
    d.innerHTML=`<i class="${spin?'fa-solid fa-circle-notch fa-spin':ic(i.icon)}" style="color:${i.color};font-size:12px"></i><span>${esc(i.tab||i.title)}</span>${tabs.length>1?'<button class="x" title="Close tab"><i class="fa-solid fa-xmark"></i></button>':''}`;
    d.onclick=e=>{if(e.target.closest('.x')){closeTab(t.path);return}go(t.path)};
    d.onauxclick=e=>{if(e.button===1)closeTab(t.path)};
    c.appendChild(d)});
  const add=document.createElement('button');add.className='iconbtn';add.title='New tab';add.innerHTML='<i class="fa-solid fa-plus"></i>';add.onclick=()=>{if(tabs.some(x=>x.path==='/'))go('/');else{tabs.push({path:'/'});go('/')}};c.appendChild(add);
  const a=c.querySelector('.active');a&&a.scrollIntoView({inline:'nearest',block:'nearest'});
}
function closeTab(path){
  if(tabs.length<=1)return;const i=tabs.findIndex(t=>t.path===path);tabs.splice(i,1);
  if(active===path){go(tabs[Math.max(0,i-1)].path)}else renderTabs()}
function updStar(){const on=bookmarks.has(parse(location.hash).path);$('#star').innerHTML=on?'<i class="fa-solid fa-star" style="color:#fbbc05"></i>':'<i class="fa-regular fa-star"></i>'}
function renderBM(){$('#bookmarks').innerHTML=BM.map(b=>`<a href="#${b[0]}"><i class="fa-solid ${b[1]}" style="color:${b[2]}"></i>${b[3]}</a>`).join('')+
 `<a href="${LINKS.linkedin}" target="_blank"><i class="fa-brands fa-linkedin" style="color:#0a66c2"></i>LinkedIn</a><a href="${LINKS.github}" target="_blank"><i class="fa-brands fa-github"></i>GitHub</a><a href="${LINKS.leetcode}" target="_blank"><i class="fa-solid fa-code" style="color:#fbbc05"></i>LeetCode</a>`}
function renderMenu(){$('#menu').innerHTML=`<div style="padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px"><b>ESWARI L R</b><div style="font-size:11px;color:var(--muted)">FULL STACK | Software Developer</div></div>`+
 [['/','fa-plus','New tab'],['/profile','fa-user','Profile'],['/skills','fa-code','Skills'],['/experience','fa-briefcase','Experience'],['/education','fa-graduation-cap','Education'],['/projects','fa-laptop-code','Projects'],['/achievements','fa-trophy','Achievements'],['/contact','fa-paper-plane','Contact']].map(m=>`<button data-p="${m[0]}"><i class="fa-solid ${m[1]}" style="width:16px"></i>${m[2]}</button>`).join('')+
 `<button data-r="1" style="color:var(--link)"><i class="fa-solid fa-file-arrow-down" style="width:16px"></i>Download resume</button>`;
 $('#menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#menu').classList.remove('open');if(b.dataset.r)downloadResume();else if(b.dataset.p==='/'){if(!tabs.some(x=>x.path==='/'))tabs.push({path:'/'});go('/')}else go(b.dataset.p)}}

$('#back').onclick=()=>history.back();
$('#fwd').onclick=()=>history.forward();
$('#reload').onclick=()=>{const i=$('#reload i');i.classList.add('fa-spin');render();setTimeout(()=>i.classList.remove('fa-spin'),600)};
$('#homebtn').onclick=()=>{if(!tabs.some(x=>x.path==='/'))tabs.push({path:'/'});go('/')};
$('#avatar').onclick=()=>go('/profile');
$('#star').onclick=e=>{e.preventDefault();const p=parse(location.hash).path;bookmarks.has(p)?bookmarks.delete(p):bookmarks.add(p);updStar();toast(bookmarks.has(p)?'Bookmark added':'Bookmark removed')};
$('#menubtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#menubtn'))$('#menu').classList.remove('open')});
function setTheme(t){document.documentElement.dataset.theme=t;const b=$('#themebtn');b.innerHTML=t==='dark'?'<i class="fa-solid fa-sun"></i><span>Day</span>':'<i class="fa-solid fa-moon"></i><span>Night</span>';b.title=t==='dark'?'Switch to day mode':'Switch to night mode';try{localStorage.setItem('theme',t)}catch(e){}}
$('#themebtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let _th='dark';try{_th=localStorage.getItem('theme')||'dark'}catch(e){}setTheme(_th);
$('#viewport').addEventListener('click',e=>{const dq=e.target.closest('[data-q]');if(dq){runSearch(dq.dataset.q);return}if(e.target.closest('[data-clear]')){clearSearch();return}const c=e.target.closest('[data-go]');if(c&&!e.target.closest('a,button'))go(c.dataset.go)});
$('#viewport').addEventListener('scroll',()=>{const v=$('#viewport');const m=v.scrollHeight-v.clientHeight;$('#sprog').style.width=(m>0?v.scrollTop/m*100:0)+'%';$('#totop').classList.toggle('on',v.scrollTop>450)});
$('#totop').onclick=()=>$('#viewport').scrollTo({top:0,behavior:'smooth'});
$('#omni').addEventListener('submit',e=>e.preventDefault());
attachSuggest($('#addr'),$('#sg-omni'),$('#omniwrap'),true);
window.addEventListener('hashchange',render);
$('#resfab').onclick=e=>{e.stopPropagation();$('#rmenu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#rmenu')&&!e.target.closest('#resfab'))$('#rmenu').classList.remove('open');
  const b=e.target.closest('.pbtn,.btn,.fab,.fbtn,.kpbl,.hirebig,.gtabs a');if(b){const r=b.getBoundingClientRect(),sp=document.createElement('span');sp.className='ripple';const d=Math.max(r.width,r.height)*1.6;sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),650)}});
$('#viewport').addEventListener('mousemove',e=>{const t=e.target.closest('.tilt');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg) scale(1.03)`});
$('#viewport').addEventListener('mouseout',e=>{const t=e.target.closest('.tilt');if(t&&!t.contains(e.relatedTarget))t.style.transform=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeResume()});
renderBM();renderMenu();render();
</script>
